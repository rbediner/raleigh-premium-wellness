name: Preview Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run preview preflight
        run: npm run release:preflight:preview

      - name: Publish preview artifact to gh-pages
        run: node scripts/release/publish-github-pages-branch.mjs --mode preview
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview URL
        run: >
          node scripts/release/verify-remote-deployment.mjs
          --mode preview
          --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/
          --sha ${{ github.sha }}
          --ci-run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --deploy-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/

      - name: Write preview summary
        run: |
          {
            echo "## Preview Deploy"
            echo ""
            echo "- Branch: staging"
            echo "- Commit: ${{ github.sha }}"
            echo "- Preview URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/"
            echo "- CI Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
