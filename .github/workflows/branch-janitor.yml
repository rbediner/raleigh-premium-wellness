name: branch janitor

# CI-STANDARD.md, Branch hygiene rule 4. Daily: keep the default branch, the head of every open pull request and any branch with a
# commit in the last 24 hours; archive the tip of every other unmerged branch under refs/archive/branches/<name>, then delete it.
# A merged branch is deleted with no archive. Restore: git fetch origin refs/archive/branches/<name>.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive then delete inactive branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open_heads=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          cutoff=$(date -u -d '24 hours ago' +%s)
          git for-each-ref --format='%(refname:strip=3) %(objectname) %(committerdate:unix)' refs/remotes/origin | while read -r name sha ts; do
            [ "$name" = "HEAD" ] && continue
            [ "$name" = "$DEFAULT" ] && continue
            [ "$name" = "staging" ] && continue
            [ "$name" = "gh-pages" ] && continue
            echo "$open_heads" | grep -qxF "$name" && continue
            [ "$ts" -ge "$cutoff" ] && continue
            if ! git merge-base --is-ancestor "$sha" "origin/$DEFAULT"; then
              git push origin "$sha:refs/archive/branches/$name"
            fi
            git push origin ":refs/heads/$name"
          done
